<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji to PNG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .app {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #emojiInput {
            width: 100%;
            padding: 14px 16px;
            font-size: 28px;
            border: 2px solid #ddd;
            border-radius: 12px;
            outline: none;
            text-align: center;
        }

        #emojiInput:focus {
            border-color: #111;
        }

        .preview-container {
            margin: 24px 0;
            height: 220px;
            border-radius: 16px;

            /* checkerboard = transparent preview */
            background-color: #fff;
            background-image:
                linear-gradient(45deg, #ddd 25%, transparent 25%),
                linear-gradient(-45deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%),
                linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px;
            background-position:
                0 0,
                0 10px,
                10px -10px,
                -10px 0px;

            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #preview {
            font-size: 130px;
            line-height: 1;
        }

        .sizes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .size-btn {
            padding: 10px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .size-btn:hover {
            background: #f2f2f2;
        }

        .size-btn.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .custom-size {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .custom-size input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
        }

        .custom-size span {
            color: #777;
        }

        #downloadBtn {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #downloadBtn:hover {
            opacity: 0.85;
        }

        .info {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        canvas {
            display: none;
        }

        @media (max-width: 500px) {
            .app {
                margin: 16px;
                padding: 24px;
            }

            .sizes {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>Emoji → PNG</h1>
    <div class="subtitle">
        Turn any emoji into a transparent PNG.
    </div>

    <label for="emojiInput">Emoji</label>

    <input
        id="emojiInput"
        type="text"
        value="😀"
        placeholder="Paste an emoji"
    >

    <div class="preview-container">
        <div id="preview">😀</div>
    </div>

    <label>Image Size</label>

    <div class="sizes">
        <button class="size-btn" data-size="128">128</button>
        <button class="size-btn" data-size="256">256</button>
        <button class="size-btn active" data-size="512">512</button>
        <button class="size-btn" data-size="1024">1024</button>
    </div>

    <div class="custom-size">
        <input
            id="widthInput"
            type="number"
            value="512"
            min="16"
            max="4096"
        >

        <span>×</span>

        <input
            id="heightInput"
            type="number"
            value="512"
            min="16"
            max="4096"
        >

        <span>px</span>
    </div>

    <button id="downloadBtn">
        Download PNG
    </button>

    <div class="info">
        PNG is exported with a transparent background.
    </div>

</div>

<canvas id="canvas"></canvas>

<script>

    const emojiInput = document.getElementById("emojiInput");
    const preview = document.getElementById("preview");

    const widthInput = document.getElementById("widthInput");
    const heightInput = document.getElementById("heightInput");

    const sizeButtons = document.querySelectorAll(".size-btn");

    const downloadBtn = document.getElementById("downloadBtn");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");


    // ----------------------------
    // Update Preview
    // ----------------------------

    emojiInput.addEventListener("input", () => {

        const emoji = emojiInput.value.trim();

        preview.textContent = emoji || "😀";

    });


    // ----------------------------
    // Default Size Buttons
    // ----------------------------

    sizeButtons.forEach(button => {

        button.addEventListener("click", () => {

            const size = button.dataset.size;

            widthInput.value = size;
            heightInput.value = size;

            sizeButtons.forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

        });

    });


    // Remove active state when custom size changes

    widthInput.addEventListener("input", clearActiveSize);
    heightInput.addEventListener("input", clearActiveSize);

    function clearActiveSize() {

        sizeButtons.forEach(btn => {
            btn.classList.remove("active");
        });

    }


    // ----------------------------
    // Download PNG
    // ----------------------------

    downloadBtn.addEventListener("click", () => {

        const emoji = emojiInput.value.trim();

        if (!emoji) {
            alert("Please enter an emoji.");
            return;
        }

        const width = parseInt(widthInput.value);
        const height = parseInt(heightInput.value);

        if (!width || !height) {
            alert("Please enter a valid size.");
            return;
        }


        // Canvas resolution

        canvas.width = width;
        canvas.height = height;


        // Transparent background

        ctx.clearRect(0, 0, width, height);


        // Emoji size
        // Use smallest dimension so emoji fits inside image

        const smallestSide = Math.min(width, height);

        const fontSize = smallestSide * 0.78;


        // Emoji font stack

        ctx.font =
            `${fontSize}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";


        // Draw emoji

        ctx.fillText(
            emoji,
            width / 2,
            height / 2
        );


        // Convert canvas → PNG

        canvas.toBlob(blob => {

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = `emoji-${width}x${height}.png`;

            link.click();

            URL.revokeObjectURL(url);

        }, "image/png");

    });

</script>

</body>
</html>
